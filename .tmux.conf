# tmux config tuned for Claude Code (truecolor TUI) and resilient SSH sessions.
# Reload after edits with: prefix r   (prefix is Ctrl-b)

# Terminal and color: make TUIs like Claude Code render correctly
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"      # 24-bit truecolor passthrough (tmux 3.2+)
set -s escape-time 10                    # responsive Esc and meta keys in TUIs
set -g focus-events on

# Usability
set -g mouse on                          # scroll, select, and resize with the mouse
set -g history-limit 50000               # generous scrollback buffer
set -g set-clipboard on                  # copy to the system clipboard via OSC 52
set -g base-index 1                      # number windows from 1
setw -g pane-base-index 1                # number panes from 1
set -g renumber-windows on               # keep window numbers contiguous after closing

# Copy mode and clipboard: vi-style selection that also lands in the X11 clipboard.
# set-clipboard on (above) already pushes to the system clipboard via OSC 52 on
# modern VTE; the explicit xclip pipe guarantees it for local X11 sessions.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -in"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -in"

# Reload binding
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# Spec reader: prefix+S opens the fuzzy spec picker (see ~/.functions) in a
# popup over the current pane, starting in the pane's working directory.
bind S display-popup -E -w 90% -h 85% -d "#{pane_current_path}" "bash -ic spec"

# Cheat sheet: prefix+h opens ~/.tmux-cheatsheet.md in a glow popup
bind h display-popup -E -w 90% -h 85% "glow -p ~/.tmux-cheatsheet.md"

# Nested tmux (a local tmux with an SSH pane running the workstation's tmux):
# F12 hands the keyboard and mouse to the inner session, so a single Ctrl-b and
# the scroll wheel reach it instead of doubling the prefix. F12 again reclaims.
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set mouse off \;\
    set status-style "bg=default fg=colour240" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S
bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u mouse \;\
    set -u status-style \;\
    refresh-client -S

# Minimal status line so you can see which session you are in at a glance
set -g status-style "bg=default fg=colour250"
set -g status-left "#[bold] #S #[default]"
set -g status-left-length 30
set -g status-right "%H:%M "
# Window list: colored window numbers, distinct from the window name
setw -g window-status-format "#[fg=colour136]#I#[fg=colour240]:#[fg=colour250]#W#[default] "
setw -g window-status-current-format "#[fg=colour39,bold]#I#[fg=colour240]:#[fg=colour255,bold]#W#[default] "

# Plugins via TPM. Keep the run line LAST so the manager loads after all settings.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Save and auto-restore sessions (including pane contents) across reboots.
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
