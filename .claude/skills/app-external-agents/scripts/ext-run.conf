# shellcheck shell=bash disable=SC2034
# Settings of ext-run, sourced by the runner from its own directory.
# Values are what probes on the real CLIs showed on 2026-11-15 (OpenCode
# 1.19.0, agy 1.5.9, Codex 0.169.0); the evidence is in the design's
# "Evidence" section. The runner reads these facts from here only.

# OpenCode release the agent files were tested with; the guard allows
# another release of the same major version and reports it as untested.
OC_TESTED_VERSION=1.19.0

# Permission key whose blanket deny removes OpenCode's skill tool from the
# set offered to the model.
OC_SKILL_DENY_KEY=skill

# Substring of OpenCode's tool error for a permission that was asked and
# refused (a headless run refuses every ask).
OC_ASK_REJECT_TEXT='rejected permission to use this specific tool call'

# Extra arguments for every agy invocation.
AGY_EXTRA_ARGS=(--disable-slash-commands)

# agy's quota error, its usage limit (rule 5): a non-zero exit and a result
# whose status is not SUCCESS, with the first text on standard error or the
# second in the result's error text. Seen twice on the default model, exit
# 3: Task 1's probe of 2026-11-15 (build-probes/2026-11-15-1852-agy-no-slash,
# agy.ndjson and agy.err) and the acceptance run of 2026-11-16
# (build-probes/2026-11-16-2137-acceptance, a/agy.first1.stdout and .stderr).
# The error ends with "Resets in" and a duration such as 113h24m55s; the
# runner adds that duration to the attempt's end for reset_at. Refused before
# the model's first turn, both traces held step_update events of step_type
# user_input and error_message only; an attempt whose trace holds no other
# step_type counts as refused at the door, so a continue starts afresh.
AGY_QUOTA_STDERR_TEXT='RESOURCE_EXHAUSTED (code 429)'
AGY_QUOTA_ERROR_TEXT='Individual quota reached'

# Arguments that keep skills out of codex exec; codex exec resume accepts
# them too.
CODEX_EXTRA_ARGS=(-c skills.include_instructions=false)

# yes when a write under Codex's read-only sandbox was seen refused.
CODEX_WRITE_REFUSED=yes
