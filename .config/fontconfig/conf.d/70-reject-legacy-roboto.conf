<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The Roboto files in /usr/share/fonts/truetype/custom/ are the 2011
  release with broken weight metadata (Black and Regular declare the
  same weight class), which makes fontconfig resolve Roboto weights
  wrongly (e.g. bold and regular invert). Current Roboto variable
  fonts live in ~/.local/share/fonts/roboto/. This rule hides only the
  sixteen legacy Roboto-*.ttf files from matching; the rest of the
  custom font library is untouched. Added 2026-08-04.

  The glob starts with "*" on purpose: fontconfig 2.17.1 ignores an
  absolute rejectfont glob when the calling process runs from a
  directory that is a leading part of the font's path (/, /usr,
  /usr/share/fonts), and the legacy files came back there. The
  wildcard form held from every directory tested (2026-11-16, font
  library audit in the private problems repo).
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/truetype/custom/Roboto-*.ttf</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
